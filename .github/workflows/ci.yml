name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # 3.10 and 3.13 bracket the supported range (requires-python = ">=3.10");
    # both OSes matter because the tool targets the Zotero desktop app.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run tests (stdlib only, no network)
        run: python -m unittest discover -s tests -v

  test-toc:
    # The `test` matrix runs without PyMuPDF, so every PDF-touching test skips
    # there. This job installs the [toc] extra so they actually execute.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install the toc extra
        run: pip install pymupdf
      - name: Run tests (with the PDF engine)
        run: python -m unittest discover -s tests -v

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/ruff-action@v3
        with:
          args: check src tests cli/zot scripts

  reference-drift:
    # The command reference is generated from the argparse tree; fail if a
    # help-text change landed without regenerating docs/ + the website page.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Regenerate the reference
        run: python scripts/gen_cli_reference.py
      - name: Fail if it drifted from the committed copies
        run: |
          git diff --exit-code -- docs/commands.md web/src/content/docs/reference/commands.md \
            || { echo "::error::Reference is stale — run 'python scripts/gen_cli_reference.py' and commit."; exit 1; }

  homebrew:
    # The formula installs the package with --no-deps and takes every dependency
    # from packaging/homebrew/requirements.txt, so a stale lock ships a crippled
    # `brew install` (the failure that retired the 0.3.0 tap). Recompiling keeps
    # the existing pins — uv only moves them with --upgrade — so this job is
    # quiet until pyproject's constraints actually change.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Verify the formula is generated output, not a hand edit
        run: python3 scripts/gen_homebrew_formula.py --check
      - name: Recompile the dependency lock
        run: python3 scripts/gen_homebrew_formula.py --relock
      - name: Fail if it drifted from the committed lock
        run: |
          git diff --exit-code -- packaging/homebrew/requirements.txt \
            || { echo "::error::Homebrew lock is stale — run 'python scripts/gen_homebrew_formula.py --relock' and commit."; exit 1; }

  build-xpi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build the bridge XPI
        run: bash plugin/build.sh
      - name: Verify the XPI is a valid zip with a manifest
        run: |
          unzip -l dist/zotero-agent-bridge.xpi | grep -q manifest.json
      - name: Verify updates.json announces this version
        # Catches a version bump that forgot the auto-update manifest, which
        # would silently freeze every installed plugin.
        run: python3 scripts/gen_updates_json.py --check
      - uses: actions/upload-artifact@v4
        with:
          name: zotero-agent-bridge-xpi
          path: dist/zotero-agent-bridge-*.xpi

  build-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Build wheel + sdist
        run: uv build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*.whl

  build-site:
    # Catch a web-breaking change on the PR, before it reaches the Pages deploy.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build with Astro
        run: pnpm build

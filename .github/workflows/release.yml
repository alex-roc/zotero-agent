name: Release

# Tag a version (vX.Y.Z) to build the XPI + wheel, publish a GitHub Release with
# the XPI attached, publish the package to PyPI via Trusted Publishing, and
# announce the release in the two manifests that live on main: updates.json (the
# plugin's auto-update) and the Homebrew formula (which the tap mirrors).
#
# One-time setup on pypi.org: add a Trusted Publisher for this repo + workflow
# (Publishing → Add a new pending publisher) so no API token is needed here.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write        # create the GitHub Release
  id-token: write        # PyPI Trusted Publishing (OIDC)

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build wheel + sdist (into dist/)
        run: uv build

      - name: Build the bridge XPI (into release-assets/, keeping dist/ PyPI-only)
        # Two names for one file: the versioned asset (what updates.json points
        # at, immutable) and a stable one, so
        # /releases/latest/download/zotero-agent-bridge.xpi never breaks.
        run: |
          bash plugin/build.sh
          mkdir -p release-assets
          mv dist/zotero-agent-bridge-*.xpi release-assets/
          rm -f dist/zotero-agent-bridge.xpi   # drop the symlink so dist/ is PyPI-only
          cp release-assets/zotero-agent-bridge-*.xpi release-assets/zotero-agent-bridge.xpi

      - name: Create GitHub Release with the XPI
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*.xpi
          generate_release_notes: true

      - name: Publish to PyPI (Trusted Publishing)
        # Before the commit below, because the Homebrew formula points at this
        # sdist's PyPI URL: publishing first means the formula never names a file
        # that does not exist yet.
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist          # wheel + sdist only
          verbose: true

      - name: Announce the release on main (plugin auto-update + Homebrew)
        # Two manifests, one commit, both of which strand users if they lag:
        # updates.json is what the installed plugin polls, and the formula is what
        # the tap mirrors. The formula's sha256 comes from the sdist just built —
        # hatchling sdists are not byte-identical across machines, so it cannot be
        # precomputed when preparing the release.
        run: |
          XPI="$(ls release-assets/zotero-agent-bridge-*.xpi)"
          # Generate while still on the tag, so the version comes from the tagged
          # commit even if main has moved on; then carry the files over to main.
          python3 scripts/gen_updates_json.py --xpi "$XPI"
          python3 scripts/gen_homebrew_formula.py --sdist dist/zotero_agent-*.tar.gz
          cp updates.json packaging/homebrew/zotero-agent.rb "$RUNNER_TEMP/"
          git fetch origin main
          git checkout -B main origin/main
          cp "$RUNNER_TEMP/updates.json" updates.json
          cp "$RUNNER_TEMP/zotero-agent.rb" packaging/homebrew/zotero-agent.rb
          if git diff --quiet -- updates.json packaging/homebrew/zotero-agent.rb; then
            echo "both manifests already current"
          else
            git config user.name  "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git commit -m "release: announce ${GITHUB_REF_NAME} in updates.json and the Homebrew formula" \
              -- updates.json packaging/homebrew/zotero-agent.rb
            git push origin main
          fi

      - name: Remind the maintainer to sync the tap
        # GITHUB_TOKEN cannot dispatch another repo's workflow, and this project
        # deliberately stores no PAT. The tap does not poll for a file that only
        # changes at release time, so this command is how the formula gets there;
        # its weekly schedule is only a net for having forgotten it.
        run: |
          echo "::notice::Formula committed. Now run: gh workflow run sync.yml --repo alex-roc/homebrew-tap"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "zotero-agent"
dynamic = ["version"]
description = "Local read-write control of a Zotero library — from your terminal or your AI agent. No cloud, no API key."
readme = "README.md"
license = "AGPL-3.0-or-later"
requires-python = ">=3.10"
authors = [{ name = "Alex Ojeda Copa" }]
keywords = ["zotero", "cli", "mcp", "ai-agent", "reference-manager", "bibliography", "local-first"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Text Processing :: Markup",
    "Topic :: Utilities",
]
dependencies = []  # core is stdlib-only, on purpose

[project.optional-dependencies]
mcp = ["mcp>=1.2.0"]
# `zot toc` reads and writes PDF outlines. PyMuPDF is a multi-megabyte binary
# wheel and is AGPL-3.0 — the same licence as this project since 0.4.0 — but it
# stays an extra so the 90% of the CLI that never opens a PDF installs light.
toc = ["pymupdf>=1.24"]
dev = ["ruff>=0.6"]

[project.scripts]
zot = "zotero_agent.cli:main"

[project.urls]
Homepage = "https://github.com/alex-roc/zotero-agent"
Documentation = "https://alex-roc.github.io/zotero-agent"
Repository = "https://github.com/alex-roc/zotero-agent"
Issues = "https://github.com/alex-roc/zotero-agent/issues"
Changelog = "https://github.com/alex-roc/zotero-agent/blob/main/CHANGELOG.md"

[tool.hatch.version]
path = "src/zotero_agent/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/zotero_agent"]
# One install must deliver all four surfaces (CLI, MCP, skill, AGENTS.md), so the
# non-Python assets ride along in the wheel; `zot skill install` / `zot plugin
# build` unpack them. See src/zotero_agent/assets.py.

# The skill and AGENTS.md ride along so `zot skill install` works from PyPI. The
# plugin does not: the XPI ships only as a GitHub Release asset. Listed
# file-by-file because force-include is not subject to `exclude`, so a
# whole-directory include would also ship local artifacts; tests/test_zot.py
# asserts this list still covers every skill file.
[tool.hatch.build.targets.wheel.force-include]
"skill/SKILL.md" = "zotero_agent/_assets/skill/SKILL.md"
"skill/references" = "zotero_agent/_assets/skill/references"
"AGENTS.md" = "zotero_agent/_assets/AGENTS.md"

[tool.hatch.build.targets.sdist]
# The sdist is a source mirror; keep the build inputs, drop local artifacts.
exclude = ["/dist", "/web/node_modules", "/web/dist", "/zotero-workspace", "/skill/scripts", "/marketing"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
# %-formatting is used throughout, including the deliberate %r/%s injection into
# generated JavaScript, so the pyupgrade %->format rules are intentionally off.
ignore = ["E501"]  # long JS-string lines are intentional

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]  # sys.path must be set before importing the package
"cli/zot" = ["E402"]
